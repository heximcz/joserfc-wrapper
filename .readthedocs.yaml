# Read the Docs configuration
# https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    # Sphinx requires Python 3.12+
    python: "3.12"
  jobs:
    post_create_environment:
      - python -m pip install "poetry>=2.5,<3"
    post_install:
      # the project (for autodoc) and the docs dependency group
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH python -m poetry install --with docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
