[project]
name = "joserfc-wrapper"
version = "0.3.0"
description = "joserfc-wrapper is a library for easy use of JWT and automatic management of signature keys."
authors = [{ name = "Lubomir Spacek", email = "hexim@hexim.cz" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# keep requirements.txt in sync
dependencies = [
    "joserfc>=1.7.5,<2.0.0",
    "hvac[parser]>=2.4.0,<3.0.0",
    "fire>=0.7.1,<0.8.0",
]

[project.scripts]
genjw = "joserfc_wrapper.cli.GenJWT:run"

[project.urls]
Homepage = "https://github.com/heximcz/joserfc-wrapper"
Issues = "https://github.com/heximcz/joserfc-wrapper/issues"

[tool.poetry]
# only the library is published, never docker/, Makefile, tests or docs
packages = [{ include = "joserfc_wrapper" }]
exclude = ["docker", "Makefile"]

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
pytest = "^9.1.1"
tox = "^4.64.3"
pylint = "^4.0.9"

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 80
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["vault: tests against a running HashiCorp Vault (docker dev environment)"]
