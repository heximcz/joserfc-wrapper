# Lint and tests for pushes to main and pull requests. Also called by the
# publish workflow before a release.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # a new push cancels the running check of the same branch or pull request
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # pyright checks the code against the oldest supported version
          python-version: "3.10"

      - name: Install
        run: |
          python -m pip install --upgrade pip "poetry>=2.5,<3"
          poetry install --with dev

      - name: Check package metadata
        run: poetry check

      - name: black
        run: poetry run black --check joserfc_wrapper tests

      - name: pylint
        run: poetry run pylint joserfc_wrapper

      - name: pyright
        run: |
          npx --yes pyright --pythonversion 3.10 \
            --pythonpath "$(poetry env info --executable)" \
            joserfc_wrapper tests

      - name: markdownlint
        run: npx --yes markdownlint-cli2 README.md docs/*.md

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Sphinx requires Python 3.12+ (same as Read the Docs)
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip "poetry>=2.5,<3"
          poetry install --with docs

      - name: Build documentation (warnings are errors)
        run: poetry run sphinx-build -W --keep-going -b html docs docs/_build/html

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    services:
      # Vault in dev mode for the Vault tests (tests marked "vault")
      vault:
        image: hashicorp/vault:2.1
        env:
          VAULT_DEV_ROOT_TOKEN_ID: dev-root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd "vault status -address=http://127.0.0.1:8200"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      # Redis for the Redis tests (tests marked "redis"), the oldest
      # supported version 6.2 with the oldest Python
      redis:
        image: redis:${{ matrix.python-version == '3.10' && '6.2' || '8' }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: dev-root
      VAULT_MOUNT: jwt
      VAULT_MOUNT_V1: jwt-v1
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create Vault mounts (jwt KV v2, jwt-v1 KV v1)
        run: |
          for mount in "jwt:2" "jwt-v1:1"; do
            curl -sf -X POST -H "X-Vault-Token: $VAULT_TOKEN" \
              -d "{\"type\": \"kv\", \"options\": {\"version\": \"${mount#*:}\"}}" \
              "$VAULT_ADDR/v1/sys/mounts/${mount%%:*}"
          done

      - name: Install
        run: |
          python -m pip install --upgrade pip "poetry>=2.5,<3"
          poetry install --with dev

      - name: Test
        run: poetry run pytest -v
