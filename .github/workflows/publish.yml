# Publish a release to PyPI when a version tag (X.Y.Z) is pushed.
#
# Release: bump version in pyproject.toml, commit "X.Y.Z", then
#   git tag X.Y.Z && git push origin main X.Y.Z
#
# PyPI Trusted Publishing (no API token): the project on PyPI trusts this
# workflow (owner heximcz, repository joserfc-wrapper, workflow publish.yml,
# environment pypi).

name: Publish to PyPI

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  # lint and tests on all supported Python versions (same as for pushes)
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install --upgrade pip "poetry>=2.5,<3"

      - name: Check that the tag matches the version
        run: |
          version="$(poetry version --short)"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Check package metadata
        run: poetry check

      - name: Build
        run: poetry build

      - name: Check package content
        run: |
          python - <<'EOF'
          import glob, re, tarfile, zipfile

          # only the library is published, never docker/, Makefile, tests or docs
          allowed = re.compile(
              r"^(joserfc_wrapper/(.*\.py|py\.typed)"
              r"|joserfc_wrapper-[^/]+\.dist-info/.*"
              r"|joserfc_wrapper-[^/]+/(joserfc_wrapper/(.*\.py|py\.typed)"
              r"|README\.md|LICENSE|pyproject\.toml|PKG-INFO))$"
          )
          names = []
          for path in glob.glob("dist/*.whl"):
              names += zipfile.ZipFile(path).namelist()
          for path in glob.glob("dist/*.tar.gz"):
              names += [m.name for m in tarfile.open(path) if m.isfile()]
          unexpected = [n for n in names if not allowed.match(n)]
          if unexpected:
              raise SystemExit(f"Unexpected files in the package: {unexpected}")
          print(f"OK, {len(names)} files")
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/joserfc-wrapper/${{ github.ref_name }}/
    permissions:
      # OIDC token for PyPI Trusted Publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release with the package files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
