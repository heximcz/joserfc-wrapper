# Publish a release to PyPI when a version tag (X.Y.Z) is pushed.
#
# Release: bump version in pyproject.toml, commit "X.Y.Z", then
#   git tag X.Y.Z && git push origin main X.Y.Z
#
# PyPI Trusted Publishing (no API token): the project on PyPI trusts this
# workflow (owner heximcz, repository joserfc-wrapper, workflow publish.yml,
# environment pypi).

name: publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    services:
      # Vault in dev mode for the Vault tests (tests marked "vault")
      vault:
        image: hashicorp/vault:2.1
        env:
          VAULT_DEV_ROOT_TOKEN_ID: dev-root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd "vault status -address=http://127.0.0.1:8200"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: dev-root
      VAULT_MOUNT: jwt
      VAULT_MOUNT_V1: jwt-v1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create Vault mounts (jwt KV v2, jwt-v1 KV v1)
        run: |
          for mount in "jwt:2" "jwt-v1:1"; do
            curl -sf -X POST -H "X-Vault-Token: $VAULT_TOKEN" \
              -d "{\"type\": \"kv\", \"options\": {\"version\": \"${mount#*:}\"}}" \
              "$VAULT_ADDR/v1/sys/mounts/${mount%%:*}"
          done

      - name: Install
        run: |
          python -m pip install --upgrade pip "poetry>=2.5,<3"
          poetry install --with dev

      - name: Test
        run: poetry run pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install --upgrade pip "poetry>=2.5,<3"

      - name: Check that the tag matches the version
        run: |
          version="$(poetry version --short)"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Check package metadata
        run: poetry check

      - name: Build
        run: poetry build

      - name: Check package content
        run: |
          python - <<'EOF'
          import glob, re, tarfile, zipfile

          # only the library is published, never docker/, Makefile, tests or docs
          allowed = re.compile(
              r"^(joserfc_wrapper/.*\.py"
              r"|joserfc_wrapper-[^/]+\.dist-info/.*"
              r"|joserfc_wrapper-[^/]+/(joserfc_wrapper/.*\.py"
              r"|README\.md|LICENSE|pyproject\.toml|PKG-INFO))$"
          )
          names = []
          for path in glob.glob("dist/*.whl"):
              names += zipfile.ZipFile(path).namelist()
          for path in glob.glob("dist/*.tar.gz"):
              names += [m.name for m in tarfile.open(path) if m.isfile()]
          unexpected = [n for n in names if not allowed.match(n)]
          if unexpected:
              raise SystemExit(f"Unexpected files in the package: {unexpected}")
          print(f"OK, {len(names)} files")
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/joserfc-wrapper/${{ github.ref_name }}/
    permissions:
      # OIDC token for PyPI Trusted Publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release with the package files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
